name: Arbitrage monitor

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes (GitHub may delay a few minutes)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the arbitrage check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor_check.py
      - name: Publish signals.json
        run: |
          git config user.name "arbitrage-monitor"
          git config user.email "monitor@users.noreply.github.com"
          git add signals.json signals_history.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "monitor: update signals" && git push; fi
